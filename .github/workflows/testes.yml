name: Testes E2E

on:
  pull_request:
    branches: [develop, main]
  # reaproveitado por publicar-homologacao.yml (o check "playwright" exigido pelo ruleset continua vindo do pull_request)
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
